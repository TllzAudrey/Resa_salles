<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salles</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <ul id="nav">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/salle.html">Gestion des salles</a></li>
        <li><a href="/reservation.html">Gestion des réservations</a></li>
    </ul>
    <h1>Salles</h1>
    <p id="message" role="status" aria-live="polite"></p>
    <br>
    <hr>
    <div id="addsalle">
        <h2>Ajouter une salle</h2>
        <form id="addSalleForm">
            <label for="salleName">Nom de la salle:</label>
            <input type="text" id="salleName" name="salleName" required>
            <br>
            <label for="salleCapacity">Capacité:</label>
            <input type="number" id="salleCapacity" name="salleCapacity" min="1" required>
            <br>
            <button type="submit">Ajouter</button>
        </form>
    </div>
    <br>
    <hr>
    <div id="updatesalle">
        <h2>Mettre à jour une salle</h2>
        <form id="updateSalleForm">
            <label for="updateSalleKey">Nom actuel de la salle (identifiant):</label>
            <input type="text" id="updateSalleKey" name="updateSalleKey" required>
            <br>
            <label for="updateSalleName">Nouveau nom de la salle:</label>
            <input type="text" id="updateSalleName" name="updateSalleName" required>
            <br>
            <label for="updateSalleCapacity">Nouvelle capacité:</label>
            <input type="number" id="updateSalleCapacity" name="updateSalleCapacity" min="1" required>
            <br>
            <button type="submit">Mettre à jour</button>
        </form>
    </div>
    <br>
    <hr>
    <div id="deletesalle">
        <h2>Supprimer une salle</h2>
        <form id="deleteSalleForm">
            <label for="deleteSalleKey">Nom de la salle à supprimer (identifiant):</label>
            <input type="text" id="deleteSalleKey" name="deleteSalleKey" required>
            <br>
            <button type="submit">Supprimer</button>
        </form>
    </div>
    <br>
    <hr>
    <div id="salleList">
        <h2>Liste des salles</h2>
        <ul id="salleListItems">
            <!-- Les salles seront affichées ici -->
        </ul>
    </div>
    <script src="/app.js" defer></script>
</body>
</html>
